name: TradingOps shadow validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fail-closed release gate
        run: python -m unittest discover -s tests -v
